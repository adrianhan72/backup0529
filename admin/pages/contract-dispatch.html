    <div id="page-contract-dispatch" class="page">
      <!-- 상단 안내 -->
      <div style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #bbf7d0;border-radius:12px;padding:16px 22px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px;">
        <i class="fas fa-paper-plane" style="color:#16a34a;font-size:18px;margin-top:2px;"></i>
        <div>
          <div style="font-size:12.5px;color:#166534;line-height:1.7;">
            근로계약서 조회 화면에서 발송된 이력을 최신순으로 확인합니다.
            알림톡 · 이메일 · 수동교부(출력 교부) 모든 방식이 기록됩니다.
          </div>
        </div>
      </div>

      <!-- 미발송 계약서 카드 -->
      <div class="card" style="margin-bottom:16px;">
        <div style="padding:16px 20px 0;">

          <!-- 헤더 -->
          <div class="pss-section-head" style="margin-bottom:12px;">
            <div class="pss-section-title">
              <i class="fas fa-exclamation-triangle" style="color:#f59e0b;"></i>
              미발송 계약서
              <span class="pss-count-badge red" id="cdp-unsent-total-badge">0</span>
            </div>
            <button class="cdp-send-btn-all" id="cdp-unsent-send-all-btn" onclick="cdpSendAllKakao()" disabled>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.477 3 2 6.477 2 10.5c0 2.527 1.523 4.75 3.838 6.105l-.98 3.607a.375.375 0 0 0 .544.424L9.928 18.4A11.4 11.4 0 0 0 12 18.6c5.523 0 10-3.806 10-8.1S17.523 3 12 3z"/></svg>
              일괄 알림톡 발송
            </button>
          </div>

          <!-- 입사 년월 탭 -->
          <div class="cdp-month-tabs" id="cdp-unsent-month-tabs">
            <div class="pss-loading"><i class="fas fa-spinner fa-spin"></i> 로딩 중...</div>
          </div>

          <!-- 구분선 -->
          <div style="border-top:1px solid #f3f4f6;margin:0 -20px 0;"></div>
        </div>

        <!-- 전원 발송 완료 메시지 -->
        <div id="cdp-unsent-all-clear" class="pss-all-clear" style="display:none;margin:16px 0;padding:0 20px;">
          <i class="fas fa-check-circle" style="font-size:20px;color:#16a34a;flex-shrink:0;"></i>
          <div>
            <div style="font-size:13px;font-weight:700;color:#166534;">미발송 계약서 없음</div>
            <div style="font-size:11.5px;color:#15803d;margin-top:2px;">신규 등록된 모든 근로계약서가 발송 처리되었습니다.</div>
          </div>
        </div>

        <!-- 미발송 테이블 -->
        <div id="cdp-unsent-table-wrap" class="table-wrap" style="padding:0 0 16px;">
          <table id="cdp-unsent-table" style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr>
                <th>직원명</th>
                <th>고용구분</th>
                <th>고객사</th>
                <th>입사일</th>
                <th>연락처</th>
                <th>이메일</th>
                <th style="text-align:center;">계약서</th>
                <th style="text-align:center;">개별 관리</th>
              </tr>
            </thead>
            <tbody id="cdp-unsent-tbody">
              <tr><td colspan="8" class="pss-loading"><i class="fas fa-spinner fa-spin"></i> 로딩 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ── 타이틀 + 새로고침 ── -->
      <div class="section-title">
        <i class="fas fa-history"></i>
        <span>발송 이력</span>
        <span id="cdp-record-count" style="font-size:12px;color:#64748b;font-weight:600;"></span>
        <button onclick="(async()=>{await loadContractDispatchList(true);await renderContractDispatchPage();})()" class="btn btn-sm btn-secondary" style="margin-left:auto;" title="목록 새로 고침"><i class="fas fa-sync-alt"></i> 목록 새로 고침</button>
      </div>

      <!-- ── 필터 바 ── -->
      <div class="card" style="margin-bottom:12px;overflow:hidden;">
        <div class="filt-bar">
          <!-- 고객사 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span class="filt-label">고객사</span>
            <select id="cdp-filter-company" onchange="_cdpPage=1;renderContractDispatchPage()" class="filt-select" style="max-width:240px;">
              <option value="">전체</option>
            </select>
          </div>
          <!-- 발송 방식 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span class="filt-label">발송 방식</span>
            <select id="cdp-filter-method" onchange="_cdpPage=1;renderContractDispatchPage()" class="filt-select">
              <option value="">전체</option>
              <option value="kakao">알림톡</option>
              <option value="email">이메일</option>
              <option value="manual">수동교부</option>
            </select>
          </div>
          <!-- 발송 상태 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span class="filt-label">발송 상태</span>
            <select id="cdp-filter-status" onchange="_cdpPage=1;renderContractDispatchPage()" class="filt-select">
              <option value="">전체</option>
              <option value="completed">완료</option>
              <option value="failed">실패</option>
              <option value="pending">대기</option>
            </select>
          </div>
          <!-- 기간 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span class="filt-label">기간</span>
            <input type="date" id="cdp-filter-date-from" class="filt-date" />
            <span style="font-size:11px;color:#9ca3af;">~</span>
            <input type="date" id="cdp-filter-date-to" class="filt-date" />
            <button onclick="_cdpDoSearch()" class="filt-btn-search">조회</button>
            <span id="cdp-date-notice" style="font-size:10.5px;color:#9ca3af;white-space:nowrap;">(최대 3개월)</span>
          </div>
          <!-- 검색 (우측) -->
          <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
            <div class="filt-search-wrap">
              <i class="fas fa-search"></i>
              <input type="text" id="cdp-search" class="filt-search" style="width:150px;" placeholder="직원명·수신처 검색" oninput="renderContractDispatchPage()" />
            </div>
          </div>
        </div>
      </div>

      <!-- ── 발송 이력 테이블 ── -->
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="background:linear-gradient(135deg,#f1f5f9,#e8ecf3);border-bottom:2px solid #e2e8f0;">
                <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;">발송 일시</th>
                <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;">고객사</th>
                <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;">직원명</th>
                <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;">계약 유형</th>
                <th style="padding:11px 14px;text-align:center;font-weight:700;color:#475569;white-space:nowrap;">발송 방식</th>
                <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;">수신처</th>
                <th style="padding:11px 14px;text-align:center;font-weight:700;color:#475569;white-space:nowrap;">결과</th>
                <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;">처리자</th>
                <th style="padding:11px 14px;text-align:center;font-weight:700;color:#475569;white-space:nowrap;">계약서</th>
              </tr>
            </thead>
            <tbody id="cdp-tbody">
              <tr><td colspan="9" style="text-align:center;padding:40px;color:#9ca3af;">
                <i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i> 데이터 로딩 중...
              </td></tr>
            </tbody>
          </table>
        </div>
        <!-- 페이지네이션 -->
        <div id="cdp-pagination" style="padding:8px 16px;border-top:1px solid #f1f5f9;"></div>
      </div>
    </div><!-- /page-contract-dispatch -->
