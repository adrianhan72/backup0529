    <div id="page-leave-promotion" class="page">

            <span style="font-size:11.5px;color:#3b82f6;">※ 근로기준법 제61조에 따른 연차 사용촉진 — 발송 후 미사용 연차에 대한 수당 지급 의무가 소멸될 수 있습니다.</span>

          <select id="lp-filter-method" onchange="renderLpTable()" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 10px;font-size:12.5px;background:#fff;cursor:pointer;font-family:inherit;color:#374151;">
            <option value="">전체 방식</option>
            <option value="kakao">카카오 알림톡</option>
            <option value="email">이메일</option>
            <option value="phone">유선 직접 안내</option>

          <!-- 기간 필터 -->
          <input type="month" id="lp-filter-month-from" onchange="renderLpTable()" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 10px;font-size:12.5px;font-family:inherit;color:#374151;" />
          <span style="font-size:12px;color:#9ca3af;">~</span>

          </div>
          <button onclick="(async()=>{await loadLeavePromotionHistory(true);renderLpTable();})()" class="btn btn-sm btn-secondary"><i class="fas fa-sync-alt"></i> 새로고침</button>

      </div>

      <!-- 요약 통계 -->
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;padding:0 2px;">
        <div style="font-size:12.5px;color:#374151;">

        </div>
        <div style="font-size:12.5px;color:#374151;">

        <div style="overflow-x:auto;">
