    <div id="page-leave-promotion" class="page">

      <!-- 상단 안내 배너 -->
      <div class="cen-notice-banner info" style="margin-bottom:20px;">
        <i class="fas fa-bullhorn" style="color:#2563eb;font-size:20px;margin-top:2px;flex-shrink:0;"></i>
        <div>
          <div style="font-size:12.5px;color:#1d4ed8;line-height:1.75;">
            연차 사용촉진 메시지는 <strong>잔여 연차 조회</strong> 페이지에서 직원별로 발송할 수 있습니다.<br>
            <span style="font-size:11.5px;color:#3b82f6;">※ 근로기준법 제61조에 따른 연차 사용촉진 — 발송 후 미사용 연차에 대한 수당 지급 의무가 소멸될 수 있습니다.</span>
          </div>
        </div>
      </div>

      <!-- 필터 바 -->
      <div class="card" style="margin-bottom:16px;overflow:hidden;">
        <div style="padding:12px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafafa;">
          <!-- 고객사 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span style="font-size:11.5px;color:#6b7280;font-weight:600;white-space:nowrap;">고객사</span>
            <select id="lp-filter-company" onchange="_lpPage=1;renderLpTable()" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 10px;font-size:12px;background:#fff;cursor:pointer;font-family:inherit;color:#374151;max-width:150px;">
              <option value="">전체</option>
            </select>
          </div>
          <!-- 발송 방식 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span style="font-size:11.5px;color:#6b7280;font-weight:600;white-space:nowrap;">방식</span>
            <select id="lp-filter-method" onchange="_lpPage=1;renderLpTable()" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 10px;font-size:12px;background:#fff;cursor:pointer;font-family:inherit;color:#374151;">
              <option value="">전체</option>
              <option value="kakao">카카오 알림톡</option>
              <option value="email">이메일</option>
              <option value="phone">유선 직접 안내</option>
            </select>
          </div>
          <!-- 기간 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span style="font-size:11.5px;color:#6b7280;font-weight:600;white-space:nowrap;">기간</span>
            <input type="date" id="lp-filter-date-from" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 6px;font-size:12px;font-family:inherit;color:#374151;" />
            <span style="font-size:11px;color:#9ca3af;">~</span>
            <input type="date" id="lp-filter-date-to" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 6px;font-size:12px;font-family:inherit;color:#374151;" />
            <button onclick="_lpDoSearch()" class="btn btn-danger btn-sm" style="height:32px;">조회</button>
            <span id="lp-date-notice" style="font-size:10.5px;color:#9ca3af;white-space:nowrap;">(최대 3개월)</span>
          </div>
          <!-- 검색 + 새로고침 (우측) -->
          <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
            <div style="position:relative;">
              <i class="fas fa-search" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:11px;pointer-events:none;"></i>
              <input type="text" id="lp-search" placeholder="직원명 검색" oninput="renderLpTable()" style="padding:6px 10px 6px 26px;border:1px solid #d1d5db;border-radius:7px;font-size:12px;width:140px;font-family:inherit;" />
            </div>
            <button onclick="(async()=>{await loadLeavePromotionHistory(true);renderLpTable();})()" class="btn btn-sm btn-secondary"><i class="fas fa-sync-alt"></i></button>
          </div>
        </div>
      </div>

      <!-- 요약 통계 -->
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;padding:0 2px;">
        <div style="font-size:12.5px;color:#374151;">
          전체 <strong id="lp-total-count" style="color:#6366f1;">0</strong>건
        </div>
        <div style="font-size:12.5px;color:#374151;">
          이번달 <strong id="lp-month-count" style="color:#059669;">0</strong>건
        </div>
      </div>

      <!-- 발송 이력 테이블 -->
      <div class="card" style="overflow:hidden;padding:0;">
        <div style="overflow-x:auto;">
          <table class="al-table">
            <thead>
              <tr>
                <th>발송 일시</th>
                <th>직원명</th>
                <th>고용형태</th>
                <th>고객사</th>
                <th class="right">총 발생</th>
                <th class="right">사용</th>
                <th class="right">잔여</th>
                <th>발송 방식</th>
                <th>고객사 알림</th>
                <th>발송자</th>
                <th>연차 산정 기준</th>
              </tr>
            </thead>
            <tbody id="lp-tbody">
              <tr><td colspan="11" class="al-empty"><i class="fas fa-spinner fa-spin"></i> 불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="lp-pagination"></div>
      </div>
    </div><!-- /page-leave-promotion -->
