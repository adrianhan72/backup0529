    <div id="page-payslip-send" class="page">

      <!-- 고객사 선택 -->
      <div id="pss-company-select-card">
        <div class="section-title">
          <i class="fas fa-building" style="font-size:13px;"></i>
          <span>고객사별 급여명세서 발송 관리</span>
          <div class="filt-search-wrap" style="margin-left:auto;">
            <i class="fas fa-search"></i>
            <input type="text" id="pss-company-search" class="filt-search" placeholder="고객사명 검색" oninput="renderPssCompanyList()" />
          </div>
        </div>
        <div class="card" style="margin-bottom:16px;overflow:hidden;">
          <div id="pss-company-chips" style="padding:20px;display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>
      </div>

      <!-- 선택 고객사 콘텐츠 -->
      <div id="pss-content-section" style="display:none;">

      <!-- 선택 고객사 헤더 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:12px 18px;background:linear-gradient(90deg,#1e1b4b,#312e81);border-radius:10px;">
        <span id="pss-selected-company-label" style="font-size:14px;font-weight:700;color:#fff;"></span>
        <button onclick="clearPssCompanySelect()" class="btn btn-icon-dark" title="고객사 선택 해제"><i class="fas fa-times"></i></button>
      </div>

      <!-- 탭 메뉴 -->
      <div class="std-tab-bar" style="margin-top:0;">
        <button class="std-tab active" id="pss-tab-unsent" onclick="_pssSwitchTab('unsent')">미발송 명세서</button>
        <button class="std-tab" id="pss-tab-history" onclick="_pssSwitchTab('history')">발송 이력</button>
        <button class="std-tab" id="pss-tab-preview" onclick="_pssSwitchTab('preview')">메시지 예시</button>
      </div>

      <!-- 미발송 명세서 섹션 -->
      <div id="pss-unsent-section">
      <div class="std-tab-panel">
      <!-- 발송 년월 선택 카드 -->
      <div class="card" id="pss-unsent-month-card" style="margin-bottom:12px;overflow:hidden;">
        <div style="padding:14px 20px;">
          <div class="cdp-month-tabs" id="pss-month-tabs">
            <div class="pss-loading"><i class="fas fa-spinner fa-spin"></i> 로딩 중...</div>
          </div>
        </div>
      </div>

      <!-- 미발송 목록 카드 -->
      <div class="card" style="margin-bottom:16px;padding:0;overflow:hidden;">
        <div id="pss-unsent-all-clear" class="pss-all-clear" style="display:none;margin:16px 0;padding:0 20px;">
          <i class="fas fa-check-circle" style="font-size:20px;color:#16a34a;flex-shrink:0;"></i>
          <span style="font-size:13px;color:#166534;">미발송 명세서 없음. (선택된 모든 급여명세서가 발송 처리되었습니다.)</span>
        </div>
        <div id="pss-unsent-table-wrap" class="table-wrap" style="padding:0 0 16px;">
          <table id="pss-unsent-table" class="tbl-std">
            <thead>
              <tr>
                <th class="ctr" style="width:36px;"><input type="checkbox" id="pss-chk-all" onchange="pssToggleAll(this)" title="전체 선택" /></th>
                <th>직원명</th>
                <th>성별</th>
                <th>고용구분</th>
                <th>연락처</th>
                <th>이메일</th>
                <th class="ctr">개별 관리</th>
              </tr>
            </thead>
            <tbody id="pss-unsent-tbody">
              <tr><td colspan="6" class="pss-loading"><i class="fas fa-spinner fa-spin"></i> 로딩 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 일괄 발송 버튼 -->
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="cdp-send-btn-all" id="pss-batch-kakao-btn" onclick="pssBatchKakao()" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.477 3 2 6.477 2 10.5c0 2.527 1.523 4.75 3.838 6.105l-.98 3.607a.375.375 0 0 0 .544.424L9.928 18.4A11.4 11.4 0 0 0 12 18.6c5.523 0 10-3.806 10-8.1S17.523 3 12 3z"/></svg>
          선택 일괄 알림톡 발송
        </button>
        <button class="cdp-send-btn-all" id="pss-batch-email-btn" onclick="pssBatchEmail()" disabled style="background:#2563eb;border-color:#1d4ed8;color:#fff;">
          <i class="fas fa-envelope"></i> 선택 일괄 이메일 발송
        </button>
        <button class="cdp-send-btn-all" id="pss-batch-manual-btn" onclick="pssBatchManual()" disabled style="background:#10b981;border-color:#059669;color:#fff;">
          <i class="fas fa-hand-paper"></i> 선택 일괄 수동교부 처리
        </button>
      </div>

      </div><!-- /std-tab-panel -->
      </div><!-- /pss-unsent-section -->

      <!-- 발송 이력 섹션 -->
      <div id="pss-history-section" style="display:none;">
      <div class="std-tab-panel">

      <!-- ── 필터 바 ── -->
      <div class="card" style="margin-bottom:12px;overflow:hidden;">
        <div class="filt-bar">
          <!-- 발송 방식 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span class="filt-label">발송 방식</span>
            <select id="pss-filter-method" onchange="_pssLogPage=1;renderPssLogs()" class="filt-select">
              <option value="">전체</option>
              <option value="kakao">알림톡</option>
              <option value="email">이메일</option>
              <option value="manual">수동교부</option>
            </select>
          </div>
          <!-- 기간 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span class="filt-label">기간</span>
            <input type="date" id="pss-filter-date-from" class="filt-date" onchange="_pssLogPage=1;renderPssLogs()" />
            <span style="font-size:11px;color:#9ca3af;">~</span>
            <input type="date" id="pss-filter-date-to" class="filt-date" onchange="_pssLogPage=1;renderPssLogs()" />
          </div>
          <button onclick="_pssLogPage=1;renderPssLogs()" class="filt-btn-search">조회</button>
          <!-- 검색 (우측) -->
          <div class="filt-search-wrap" style="margin-left:auto;">
            <i class="fas fa-search"></i>
            <input type="text" id="pss-log-search" class="filt-search" style="width:140px;" placeholder="직원명 검색" oninput="_pssLogPage=1;renderPssLogs()" />
          </div>
        </div>
      </div>

      <!-- 발송 이력 테이블 카드 -->
      <div class="card" style="overflow:hidden;padding:0;">
        <div class="table-wrap" style="padding:0 0 16px;">
          <table id="pss-log-table" class="tbl-std">
            <thead>
              <tr>
                <th>직원명</th>
                <th>성별</th>
                <th>고용구분</th>
                <th>대상 월</th>
                <th>발송 일시</th>
                <th>발송 방식</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody id="pss-log-tbody">
              <tr><td colspan="6" class="cen-empty"><i class="fas fa-inbox"></i> 발송 이력이 없습니다.</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pss-log-pagination" style="padding:0 20px 16px;"></div>
      </div>

      </div><!-- /std-tab-panel -->
      </div><!-- /pss-history-section -->

      <!-- 메시지 예시 섹션 -->
      <div id="pss-preview-section" style="display:none;">
      <div class="std-tab-panel">
        <div id="pss-preview-content"></div>
      </div>
      </div><!-- /pss-preview-section -->

      </div><!-- /pss-content-section -->

    </div><!-- /page-payslip-send -->
