<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>법무부 체류자격 코드</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;background:#f1f5f9;color:#1e293b;font-size:13px;}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .top h1{font-size:16px;color:#0f172a;display:flex;align-items:center;gap:8px;}
  .top h1 i{color:#4f46e5;}
  .top .src{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#6b7280;}
  .search-row{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);flex-wrap:wrap;}
  .search-row input[type="text"]{flex:1;min-width:220px;height:34px;padding:0 12px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:13px;font-family:inherit;outline:none;}
  .search-row input[type="text"]:focus{border-color:#6366f1;}
  .search-row .count{font-size:12px;color:#475569;font-weight:700;white-space:nowrap;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  th{background:#eef2ff;color:#3730a3;text-align:left;padding:10px 12px;font-size:12px;font-weight:800;border-bottom:2px solid #c7d2fe;white-space:nowrap;}
  td{padding:9px 12px;border-bottom:1px solid #eef2f7;vertical-align:top;font-size:12.5px;}
  tr:hover td{background:#f8fafc;}
  td.code{font-weight:800;color:#4f46e5;white-space:nowrap;width:110px;}
  td.law{color:#475569;white-space:nowrap;width:120px;}
  td.name{font-weight:600;}
  td.desc{color:#64748b;}
  .empty{text-align:center;padding:36px;color:#94a3b8;font-size:13px;}
  .foot{text-align:center;font-size:11px;color:#94a3b8;margin-top:14px;}
  .pill{display:inline-block;background:#eef2ff;color:#4f46e5;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;margin-left:6px;}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><i class="fas fa-passport"></i> 법무부 체류자격 코드</h1>
    <div class="src">출처: 법무부 체류자격 코드 (2026.03.31 기준)</div>
  </div>
  <div class="search-row">
    <input type="text" id="visa-search" placeholder="코드·체류자격명·법명·설명 검색 (예: E-9, 비자, 취업)" autofocus>
    <span class="count" id="visa-count"></span>
  </div>
  <table>
    <thead>
      <tr><th>체류자격코드</th><th>법명</th><th>체류자격명</th><th>체류자격설명</th></tr>
    </thead>
    <tbody id="visa-tbody"></tbody>
  </table>
  <div class="foot">선택한 체류자격 코드를 인사기록 카드의 체류자격란에 입력하세요.</div>
</div>
<script src="../js/visa-code-data.js"></script>
<script>
(function(){
  const DATA = (typeof VISA_CODE_DATA !== 'undefined') ? VISA_CODE_DATA : [];
  const tbody = document.getElementById('visa-tbody');
  const search = document.getElementById('visa-search');
  const count = document.getElementById('visa-count');

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function render(q){
    const kw = (q||'').trim().toLowerCase();
    const rows = DATA.filter(r => !kw
      || r.code.toLowerCase().includes(kw)
      || r.name.toLowerCase().includes(kw)
      || r.law.toLowerCase().includes(kw)
      || r.desc.toLowerCase().includes(kw));
    count.textContent = '총 ' + DATA.length + '건 중 ' + rows.length + '건';
    if(!rows.length){
      tbody.innerHTML = '<tr><td colspan="4" class="empty">검색 결과가 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r =>
      '<tr>' +
        '<td class="code">' + esc(r.code) + '</td>' +
        '<td class="law">' + esc(r.law) + '</td>' +
        '<td class="name">' + esc(r.name) + '</td>' +
        '<td class="desc">' + esc(r.desc) + '</td>' +
      '</tr>'
    ).join('');
  }

  search.addEventListener('input', function(){ render(this.value); });
  render('');
})();
</script>
</body>
</html>
