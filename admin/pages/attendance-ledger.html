    <div id="page-attendance-ledger" class="page">

      <!-- 고객사 선택 -->
      <div id="atl-company-select-card">
        <div class="section-title">
          <i class="fas fa-building"></i>
          <span>고객사를 선택하세요</span>
          <div class="filt-search-wrap" style="margin-left:auto;">
            <i class="fas fa-search"></i>
            <input type="text" id="atl-company-search" class="filt-search" class="w-160" placeholder="고객사명 검색" oninput="atlRenderCompanyChips()" />
          </div>
        </div>
        <div class="card" style="margin-bottom:16px;overflow:hidden;">
          <div id="atl-company-chips" style="padding:20px;display:flex;flex-wrap:wrap;gap:8px;">
            <div style="color:#9ca3af;font-size:12.5px;padding:8px 0;display:flex;align-items:center;gap:6px;">
              <i class="fas fa-circle-notch fa-spin"></i> 고객사 목록 불러오는 중...
            </div>
          </div>
        </div>
      </div>

      <!-- 근태 분석 메인 섹션 -->
      <div id="atl-main-section" style="display:none;">

        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:linear-gradient(90deg,#1e1b4b,#312e81);border-radius:10px;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span id="atl-company-name-title" style="font-size:14px;font-weight:700;color:#fff;"></span>
            <span style="font-size:12px;color:rgba(255,255,255,.6);">근로계약 종료일로부터 5년 보존</span>
          </div>
          <button onclick="atlBackToCompanyList()" class="btn btn-icon-dark" title="고객사 선택 해제"><i class="fas fa-times"></i></button>
        </div>

        <div class="card" style="margin-bottom:16px;overflow:hidden;">
          <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid #f3f4f6;">
            <div style="display:flex;align-items:center;gap:6px;">
              <label style="font-size:12px;color:#6b7280;font-weight:600;">기준년도</label>
              <select id="atl-year-sel" onchange="atlRenderTable()" class="filt-select"></select>
            </div>
            <div class="filt-search-wrap" style="margin:0;">
              <i class="fas fa-search"></i>
              <input type="text" id="atl-emp-search" class="filt-search" placeholder="직원명 검색" oninput="atlRenderTable()" style="width:140px;" />
            </div>
          </div>

          <div style="display:flex;gap:12px;padding:16px 18px;background:#fff;border-bottom:1px solid #f3f4f6;flex-wrap:wrap;">
            <div style="flex:1;min-width:100px;background:#f0fdf4;border-radius:8px;padding:12px;text-align:center;">
              <div style="font-size:11px;color:#059669;">재직 직원수</div>
              <div style="font-size:22px;font-weight:800;color:#065f46;" id="atl-stat-emp">0</div>
            </div>
            <div style="flex:1;min-width:100px;background:#fef2f2;border-radius:8px;padding:12px;text-align:center;">
              <div style="font-size:11px;color:#dc2626;">총 결근일</div>
              <div style="font-size:22px;font-weight:800;color:#991b1b;" id="atl-stat-absent">0</div>
            </div>
            <div style="flex:1;min-width:100px;background:#fffbeb;border-radius:8px;padding:12px;text-align:center;">
              <div style="font-size:11px;color:#d97706;">총 지각</div>
              <div style="font-size:22px;font-weight:800;color:#92400e;" id="atl-stat-late">0</div>
            </div>
            <div style="flex:1;min-width:100px;background:#eef2ff;border-radius:8px;padding:12px;text-align:center;">
              <div style="font-size:11px;color:#4f46e5;">총 조퇴</div>
              <div style="font-size:22px;font-weight:800;color:#3730a3;" id="atl-stat-early">0</div>
            </div>
          </div>

          <div style="background:#fff;overflow:hidden;">
            <div style="overflow-x:auto;">
              <table class="al-table">
                <thead>
                  <tr>
                    <th>직원명</th>
                    <th>성별</th>
                    <th>고용형태</th>
                    <th>부서</th>
                    <th class="right">결근일</th>
                    <th class="right">지각</th>
                    <th class="right">조퇴</th>
                    <th style="text-align:center;">관리</th>
                  </tr>
                </thead>
                <tbody id="atl-tbody">
                  <tr><td colspan="7" class="cen-empty"><i class="fas fa-spinner fa-spin"></i> 불러오는 중...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div><!-- /카드 -->
      </div><!-- /atl-main-section -->
    </div><!-- /page-attendance-ledger -->
