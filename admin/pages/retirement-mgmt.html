<!-- ==========================================
   퇴직 관리 페이지 (retirement-mgmt)
   ========================================== -->
<div class="retirement-mgmt-wrap" style="padding:20px 24px;">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
    <h2 style="font-size:18px;font-weight:800;color:#1e293b;margin:0;"><i class="fas fa-hand-holding-usd" style="color:#7c3aed;margin-right:6px;"></i>퇴직 관리</h2>
    <span id="retirement-total-badge" style="font-size:12px;background:#f1f5f9;color:#64748b;padding:3px 10px;border-radius:12px;">0건</span>
  </div>

  <!-- 탭 -->
  <div class="retirement-tabs" style="display:flex;gap:0;border-bottom:2px solid #e2e8f0;margin-bottom:20px;">
    <button class="retirement-tab active" data-tab="insurance" onclick="switchRetirementTab('insurance')"
      style="padding:10px 18px;font-size:13px;font-weight:600;border:none;background:none;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;">
      <i class="fas fa-shield-alt" style="margin-right:5px;"></i>4대보험 상실신고 <span id="retirement-tab-count-insurance" style="font-size:11px;color:#9ca3af;"></span>
    </button>
    <button class="retirement-tab" data-tab="tax" onclick="switchRetirementTab('tax')"
      style="padding:10px 18px;font-size:13px;font-weight:600;border:none;background:none;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;">
      <i class="fas fa-file-invoice" style="margin-right:5px;"></i>원천징수 신고 <span id="retirement-tab-count-tax" style="font-size:11px;color:#9ca3af;"></span>
    </button>
    <button class="retirement-tab" data-tab="severance" onclick="switchRetirementTab('severance')"
      style="padding:10px 18px;font-size:13px;font-weight:600;border:none;background:none;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;">
      <i class="fas fa-calculator" style="margin-right:5px;"></i>퇴직정산 <span id="retirement-tab-count-severance" style="font-size:11px;color:#9ca3af;"></span>
    </button>
    <button class="retirement-tab" data-tab="noticepay" onclick="switchRetirementTab('noticepay')"
      style="padding:10px 18px;font-size:13px;font-weight:600;border:none;background:none;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;">
      <i class="fas fa-exclamation-triangle" style="margin-right:5px;"></i>해고예고수당 <span id="retirement-tab-count-noticepay" style="font-size:11px;color:#9ca3af;"></span>
    </button>
  </div>

  <!-- 탭 1: 4대보험 상실신고 -->
  <div id="retirement-tab-insurance" class="retirement-tab-content">
    <div style="font-size:12px;color:#6b7280;margin-bottom:12px;padding:8px 12px;background:#f8fafc;border-radius:6px;">
      <i class="fas fa-info-circle" style="margin-right:4px;"></i>4대보험 상실신고는 근로복지공단·국민건강보험공단 EDI에서 직접 처리합니다. 신고 완료 후 아래 버튼을 눌러주세요.
    </div>
    <table class="retirement-table" id="retirement-table-insurance">
      <thead><tr><th>직원명</th><th>고객사</th><th>퇴사일</th><th>상실일</th><th>관리</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 탭 2: 원천징수 신고 -->
  <div id="retirement-tab-tax" class="retirement-tab-content" style="display:none;">
    <div style="font-size:12px;color:#6b7280;margin-bottom:12px;padding:8px 12px;background:#f8fafc;border-radius:6px;">
      <i class="fas fa-info-circle" style="margin-right:4px;"></i>원천징수이행상황신고는 홈택스에서 직접 처리합니다. 신고 완료 후 아래 버튼을 눌러주세요.
    </div>
    <table class="retirement-table" id="retirement-table-tax">
      <thead><tr><th>직원명</th><th>고객사</th><th>퇴사일</th><th>관리</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 탭 3: 퇴직정산 -->
  <div id="retirement-tab-severance" class="retirement-tab-content" style="display:none;">
    <table class="retirement-table" id="retirement-table-severance">
      <thead><tr><th>직원명</th><th>고객사</th><th>계약시작일</th><th>해지일</th><th>재직기간</th><th>관리</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 탭 4: 해고예고수당 -->
  <div id="retirement-tab-noticepay" class="retirement-tab-content" style="display:none;">
    <table class="retirement-table" id="retirement-table-noticepay">
      <thead><tr><th>직원명</th><th>고객사</th><th>계약시작일</th><th>해지일</th><th>재직기간</th><th>해고예고수당</th><th>관리</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<style>
.retirement-tab.active { color: #4f46e5 !important; border-bottom-color: #4f46e5 !important; }
.retirement-table { width:100%; border-collapse:collapse; font-size:13px; }
.retirement-table th { text-align:left; padding:10px 8px; background:#f8fafc; color:#64748b; font-weight:600; font-size:11px; border-bottom:1px solid #e2e8f0; }
.retirement-table td { padding:10px 8px; border-bottom:1px solid #f1f5f9; color:#374151; }
.retirement-table tr:hover td { background:#fafbfd; }
</style>
