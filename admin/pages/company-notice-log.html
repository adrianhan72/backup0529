    <div id="page-company-notice-log" class="page">

      <!-- 필터 바 -->
      <div class="card" style="margin-bottom:12px;overflow:hidden;">
        <div style="padding:12px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafafa;">
          <!-- 고객사 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span style="font-size:11.5px;color:#6b7280;font-weight:600;white-space:nowrap;">고객사</span>
            <select id="cnl-filter-company" onchange="cnlOnCompanyChange()" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 10px;font-size:12px;color:#374151;background:#fff;cursor:pointer;font-family:inherit;max-width:140px;">
              <option value="">전체</option>
            </select>
          </div>
          <!-- 알림 유형 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span style="font-size:11.5px;color:#6b7280;font-weight:600;white-space:nowrap;">유형</span>
            <select id="cnl-filter-type" onchange="_cnlPage=1;renderCnlReserveCard();renderCnlTable();" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 10px;font-size:12px;color:#374151;background:#fff;cursor:pointer;font-family:inherit;max-width:130px;">
              <option value="">전체</option>
              <option value="welcome">가입환영</option>
              <option value="contract_created">신규 근로계약</option>
              <option value="contract_dispatched">계약서 발송</option>
              <option value="payslip_individual_sent">급여명세서 개별</option>
              <option value="payslip_bulk_sent">급여명세서 일괄</option>
              <option value="contract_expiry">계약만료 통지</option>
              <option value="regular_conversion">정규직 전환</option>
              <option value="leave_promotion">연차 사용촉진</option>
              <option value="severance_paid">퇴직급여 지급</option>
              <option value="notice">이용안내</option>
              <option value="general">중요공지</option>
            </select>
          </div>
          <!-- 기간 -->
          <div style="display:flex;align-items:center;gap:5px;">
            <span style="font-size:11.5px;color:#6b7280;font-weight:600;white-space:nowrap;">기간</span>
            <input type="date" id="cnl-filter-date-from" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 6px;font-size:12px;color:#374151;background:#fff;cursor:pointer;font-family:inherit;" />
            <span style="font-size:11px;color:#9ca3af;">~</span>
            <input type="date" id="cnl-filter-date-to" style="border:1px solid #d1d5db;border-radius:7px;padding:5px 6px;font-size:12px;color:#374151;background:#fff;cursor:pointer;font-family:inherit;" />
            <button onclick="_cnlDoSearch()" class="btn btn-danger btn-sm" style="height:32px;">조회</button>
            <span id="cnl-date-notice" style="font-size:10.5px;color:#9ca3af;white-space:nowrap;">(최대 3개월)</span>
          </div>
          <!-- 검색 + 새로고침 (우측) -->
          <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
            <div style="position:relative;">
              <i class="fas fa-search" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:11px;pointer-events:none;"></i>
              <input type="text" id="cnl-search" placeholder="제목 검색" oninput="renderCnlReserveCard();renderCnlTable();" style="padding:6px 10px 6px 26px;border:1px solid #d1d5db;border-radius:7px;font-size:12px;width:150px;font-family:inherit;" />
            </div>
            <button onclick="cnlReload()" class="btn btn-sm btn-secondary"><i class="fas fa-sync-alt"></i></button>
          </div>
        </div>
      </div>

      <!-- ① 예약 현황 카드 (scheduled 건만) -->
      <div id="cnl-reserve-card" style="display:none;margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <i class="fas fa-clock" style="color:#f59e0b;font-size:15px;"></i>
          <span style="font-size:15px;font-weight:800;color:#1e293b;">예약 현황</span>
          <span id="cnl-reserve-badge" style="background:#fef3c7;color:#b45309;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;"></span>
        </div>
        <div class="card" style="padding:0;overflow:hidden;border:1.5px solid #fde68a;">
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead>
                <tr style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border-bottom:2px solid #fde68a;">
                  <th style="padding:10px 14px;text-align:left;font-weight:700;color:#92400e;white-space:nowrap;width:150px;">예약 일시</th>
                  <th style="padding:10px 14px;text-align:left;font-weight:700;color:#92400e;white-space:nowrap;width:130px;" id="cnl-reserve-th-company">고객사</th>
                  <th style="padding:10px 14px;text-align:left;font-weight:700;color:#92400e;white-space:nowrap;width:130px;">알림 유형</th>
                  <th style="padding:10px 14px;text-align:left;font-weight:700;color:#92400e;">제목</th>
                  <th style="padding:10px 14px;text-align:left;font-weight:700;color:#92400e;white-space:nowrap;width:70px;">발송자</th>
                  <th style="padding:10px 14px;text-align:center;font-weight:700;color:#92400e;width:160px;">작업</th>
                </tr>
              </thead>
              <tbody id="cnl-reserve-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ② 발송 이력 테이블 영역 (sent / cancelled만) -->
      <div id="cnl-main-section">

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <i class="fas fa-paper-plane" style="color:#6366f1;font-size:14px;"></i>
          <span style="font-size:15px;font-weight:800;color:#1e293b;">발송 이력</span>
          <span id="cnl-total-badge" style="font-size:12px;color:#64748b;font-weight:600;"></span>
        </div>

        <!-- 이력 테이블 -->
        <div class="card tbl-loading-wrap" id="cnl-table-card" style="padding:0;overflow:hidden;">
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead>
                <tr style="background:linear-gradient(135deg,#f1f5f9,#e8ecf3);border-bottom:2px solid #e2e8f0;">
                  <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;width:140px;">발송 일시</th>
                  <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;width:120px;" id="cnl-th-company">고객사</th>
                  <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;width:130px;">알림 유형</th>
                  <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;">제목</th>
                  <th style="padding:11px 14px;text-align:center;font-weight:700;color:#475569;width:60px;">확인</th>
                  <th style="padding:11px 14px;text-align:left;font-weight:700;color:#475569;white-space:nowrap;width:70px;">발송자</th>
                  <th style="padding:11px 14px;text-align:center;font-weight:700;color:#475569;width:60px;">상세</th>
                </tr>
              </thead>
              <tbody id="cnl-tbody"></tbody>
            </table>
          </div>
          <!-- 페이지네이션 -->
          <div id="cnl-pagination" style="padding:8px 16px;border-top:1px solid #f1f5f9;"></div>
        </div>

      </div><!-- /cnl-main-section -->

      <!-- 메시지 본문 상세 모달 -->
      <div id="cnl-detail-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;align-items:center;justify-content:center;">
        <div style="background:#fff;border-radius:16px;width:min(600px,92vw);max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;">
          <!-- 모달 헤더 -->
          <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid #f1f5f9;position:sticky;top:0;background:#fff;z-index:1;">
            <div style="display:flex;align-items:center;gap:10px;">
              <i class="fas fa-bell" style="color:#6366f1;font-size:18px;"></i>
              <span style="font-size:15px;font-weight:800;color:#1e293b;">알림 상세 보기</span>
            </div>
            <button onclick="closeCnlDetailModal()" class="btn btn-close">✕</button>
          </div>
          <!-- 모달 본문 -->
          <div id="cnl-detail-body" style="padding:20px 22px;"></div>
        </div>
      </div>

    </div><!-- /page-company-notice-log -->
