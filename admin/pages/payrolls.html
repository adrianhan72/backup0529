    <div id="page-payrolls" class="page">
      <!-- 고객사 선택 -->
      <div id="pay-company-select-card">
        <div class="section-title">
          <i class="fas fa-building"></i>
          <span>고객사를 선택하세요</span>
          <div class="filt-search-wrap" style="margin-left:auto;">
            <i class="fas fa-search"></i>
            <input type="text" id="pay-company-search" class="filt-search" class="w-160" placeholder="고객사명 검색" oninput="renderPayCompanyList()" />
          </div>
          <button class="btn btn-success" id="pay-excel-btn" style="display:none;" onclick="openExcelModal()"><i class="fas fa-file-excel"></i> 엑셀 양식 다운로드</button>
        </div>
        <div class="card" style="margin-bottom:16px;overflow:hidden;">
          <div id="pay-company-chips" style="padding:20px;display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>
      </div>

      <!-- 선택된 고객사 임금대장 섹션 -->
      <div id="pay-list-section" style="display:none;">
        <!-- 숨김 호환용 select -->
        <select id="pay-company-filter" style="display:none;"></select>
        <!-- 선택 고객사 헤더 -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:linear-gradient(90deg,#1e1b4b,#312e81);border-radius:10px;margin-bottom:12px;">
          <span id="pay-selected-company-label" style="font-size:14px;font-weight:700;color:#fff;"></span>
          <button onclick="clearPayCompanySelect()" class="btn btn-icon-dark" title="고객사 선택 해제"><i class="fas fa-times"></i></button>
        </div>

        <!-- ── 필터 바 ── -->
        <div class="filt-bar" style="justify-content:flex-start;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:12px;">
          <select id="pay-year-filter" onchange="pages.pay=1;renderPayrolls()" class="filt-select"></select>
          <select id="pay-month-filter" onchange="pages.pay=1;renderPayrolls()" class="filt-select"></select>
          <div class="filt-search-wrap" style="margin-left:auto;">
            <i class="fas fa-search"></i>
            <input type="text" id="pay-search" class="filt-search" style="width:140px;" placeholder="직원명 검색" oninput="renderPayrolls()" />
          </div>
        </div>

        <!-- ── 급여명세서 목록 카드 ── -->
        <div class="card" style="overflow:hidden;padding:0;">
          <div class="table-wrap">
            <table class="tbl-std">
              <thead>
                <tr>
                  <th>직원명</th><th>성별</th><th>고용구분</th><th>근로일수</th><th>연장H</th>
                  <th>지급총액</th>
                  <th>매월지급</th>
                  <th>추가근로수당</th>
                  <th>부정기지급</th>
                  <th>공제합계</th><th>영수액</th><th style="width:60px;"></th>
                </tr>
              </thead>
              <tbody id="pay-tbody"></tbody>
            </table>
          </div>
          <div class="pagination" id="pay-pagination"></div>
          <!-- 일괄 발송 버튼 (하단 중앙) -->
          <div style="display:flex;justify-content:center;padding:12px 0 16px;">
            <button id="bulk-send-btn" onclick="openBulkSendModal()" disabled
              class="btn btn-kakao" style="padding:8px 18px;font-size:13px;box-shadow:0 2px 8px rgba(234,179,8,.25);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;"><path d="M12 3C6.477 3 2 6.477 2 10.5c0 2.527 1.523 4.75 3.838 6.105l-.98 3.607a.375.375 0 0 0 .544.424L9.928 18.4A11.4 11.4 0 0 0 12 18.6c5.523 0 10-3.806 10-8.1S17.523 3 12 3z"/></svg> 명세서 PDF 일괄 발송
            </button>
          </div>
        </div>
      </div>
    </div><!-- /page-payrolls -->

    <!-- ?? 일괄 발송 모달 ?? -->
    <div class="modal-overlay" id="bulk-send-modal" onclick="if(event.target===this)closeBulkSendModal()">
      <div style="background:#fff;border-radius:18px;width:96%;max-width:760px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.35);">

        <!-- 모달 헤더 -->
        <div style="background:linear-gradient(135deg,#4c1d95,#6d28d9);padding:22px 28px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
          <div>
            <div style="color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="#c4b5fd"><path d="M12 3C6.477 3 2 6.477 2 10.5c0 2.527 1.523 4.75 3.838 6.105l-.98 3.607a.375.375 0 0 0 .544.424L9.928 18.4A11.4 11.4 0 0 0 12 18.6c5.523 0 10-3.806 10-8.1S17.523 3 12 3z"/></svg>급여명세서 PDF 일괄 발송 <span style="font-size:13px;font-weight:500;color:#c4b5fd;">(카카오 알림톡)</span></div>
            <div id="bulk-send-subtitle" style="color:#c4b5fd;font-size:12px;margin-top:4px;"></div>
          </div>
          <button onclick="closeBulkSendModal()" class="btn btn-icon-dark"><i class="fas fa-times"></i></button>
        </div>

        <!-- 진행 상태 요약 바 -->
        <div id="bulk-progress-bar-wrap" style="background:#f5f3ff;padding:14px 28px;border-bottom:1px solid #ede9fe;flex-shrink:0;display:none;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span id="bulk-progress-label" style="font-size:12.5px;font-weight:600;color:#5b21b6;"></span>
            <span id="bulk-progress-pct" style="font-size:12px;color:#7c3aed;font-weight:700;"></span>
          </div>
          <div style="background:#ddd8fe;border-radius:99px;height:7px;overflow:hidden;">
            <div id="bulk-progress-bar" style="height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:99px;width:0%;transition:width .4s ease;"></div>
          </div>
        </div>

        <!-- 직원 목록 테이블 -->
        <div style="overflow-y:auto;flex:1;padding:20px 28px;">
          <table id="bulk-send-table" style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="background:#f8f5ff;">
                <th style="padding:10px 12px;text-align:left;font-weight:700;color:#4c1d95;border-bottom:2px solid #ede9fe;width:100px;">직원명</th>
                <th style="padding:10px 12px;text-align:left;font-weight:700;color:#4c1d95;border-bottom:2px solid #ede9fe;width:130px;">휴대전화번호</th>
                <th style="padding:10px 12px;text-align:left;font-weight:700;color:#4c1d95;border-bottom:2px solid #ede9fe;width:170px;">이메일</th>
                <th style="padding:10px 12px;text-align:left;font-weight:700;color:#4c1d95;border-bottom:2px solid #ede9fe;width:110px;">발송 상태</th>
                <th style="padding:10px 12px;text-align:center;font-weight:700;color:#4c1d95;border-bottom:2px solid #ede9fe;">개별 관리</th>
              </tr>
            </thead>
            <tbody id="bulk-send-tbody"></tbody>
          </table>
        </div>

        <!-- 모달 하단 버튼 -->
        <div style="padding:16px 28px;border-top:1px solid #ede9fe;display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;background:#faf9ff;">
          <button id="bulk-send-start-btn" onclick="startBulkSend()" class="btn btn-kakao"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.477 3 2 6.477 2 10.5c0 2.527 1.523 4.75 3.838 6.105l-.98 3.607a.375.375 0 0 0 .544.424L9.928 18.4A11.4 11.4 0 0 0 12 18.6c5.523 0 10-3.806 10-8.1S17.523 3 12 3z"/></svg> 알림톡 일괄 발송 시작</button>
          <button onclick="closeBulkSendModal()" class="btn btn-secondary">닫기</button>
        </div>
      </div>
    </div>
